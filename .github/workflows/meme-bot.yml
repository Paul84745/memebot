name: meme-bot

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (generate a meme, do not post)"
        type: boolean
        default: true
      force:
        description: "Post one meme right now, ignoring the schedule"
        type: boolean
        default: false
      dump:
        description: "Make a carousel meme dump instead of a single meme"
        type: boolean
        default: false

concurrency:
  group: meme-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install ffmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Run bot
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          DUMP: ${{ inputs.dump && '1' || '0' }}
        run: python bot/main.py

      # GitHub heavily throttles `schedule` crons (runs can be hours apart). So after each
      # run, if the next post slot is due within 40 min, wait for it and re-trigger ourselves.
      - name: Chain to next slot
        if: ${{ always() && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WAIT=$(python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          try:
              slots = json.load(open("state.json"))["schedule"]["slots"]
              now = datetime.now(timezone.utc)
              d = [(datetime.fromisoformat(s["t"]) - now).total_seconds() for s in slots if s["status"] == "pending"]
              d = [x for x in d if x > -1500]  # slots later than MAX_LATE get skipped anyway
              print(int(max(60, min(d) + 30)) if d and min(d) < 2400 else "")
          except Exception:
              print("")
          PY
          )
          if [ -n "$WAIT" ]; then
            echo "Next slot in ${WAIT}s - waiting, then re-triggering"
            sleep "$WAIT"
            gh workflow run meme-bot.yml --ref main -f dry_run=false -f force=false
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.dry_run }}
        with:
          name: preview
          path: out/
